name: FactoryTestIOS
options:
  bundleIdPrefix: dev.aakashdadhich.factory
  deploymentTarget:
    iOS: "17.0"
packages:
  Logging:
    url: https://github.com/apple/swift-log
    exactVersion: 1.6.3
targets:
  FactoryTestIOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: Logging
        product: Logging
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.aakashdadhich.factory.FactoryTestIOS
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: FactoryTestIOS
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
schemes:
  FactoryTestIOS:
    build:
      targets:
        FactoryTestIOS: all
